<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>NEURO_STIM PERFORMANCE</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;900&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --bg: #000; --accent: #4deeea; --text: #fff; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); height: 100dvh; display: flex; flex-direction: column; overflow: hidden; padding: 20px; }

        /* Correction du centrage : width 100% et flex centré */
        .header { height: 10vh; display: flex; align-items: center; justify-content: center; width: 100%; flex: none; }
        .logo { font-weight: 900; font-size: 1.8rem; letter-spacing: 4px; color: var(--accent); text-transform: uppercase; text-align: center; width: 100%; }
        .logo span { font-weight: 100; opacity: 0.7; }

        .kpi-container { display: flex; justify-content: space-between; gap: 20px; margin-bottom: 30px; flex: none; }
        .kpi-card { flex: 1; text-align: center; border-bottom: 2px solid #333; padding-bottom: 15px; }
        .kpi-label { font-size: 0.8rem; color: #fff; text-transform: uppercase; letter-spacing: 1px; display: block; margin-bottom: 10px; font-weight: 700; }
        .kpi-val { font-family: 'JetBrains Mono', monospace; font-size: 2.2rem; font-weight: 900; color: #fff; }

        .chart-container { flex: 1; min-height: 0; background: #050505; border-radius: 15px; border: 1px solid #222; padding: 20px; }
        
        .footer { height: 10vh; display: flex; align-items: center; justify-content: center; flex: none; }
        .btn-back { font-size: 1rem; font-weight: 900; color: #fff; text-decoration: none; letter-spacing: 2px; border: 2px solid #333; padding: 15px 40px; border-radius: 12px; background: #080808; }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">NEURO_STIM <span>PERFORMANCE</span></div>
    </div>

    <div class="kpi-container">
        <div class="kpi-card">
            <span class="kpi-label">Maîtrise (30j)</span>
            <div class="kpi-val" id="mastery-rate">0%</div>
        </div>
        <div class="kpi-card">
            <span class="kpi-label">Intervalle Moyen</span>
            <div class="kpi-val" id="avg-gap">0.0h</div>
        </div>
    </div>

    <div class="chart-container">
        <canvas id="evolutionChart"></canvas>
    </div>

    <div class="footer">
        <a href="index.html" class="btn-back">RETOUR</a>
    </div>

<script>
    function loadData() {
        const saved = localStorage.getItem('neuro_stim_apex_final');
        return saved ? JSON.parse(saved) : { records: [], goal: 12 };
    }

    function processEvolution() {
        const db = loadData();
        const records = db.records || [];
        const dailyData = {};
        const last30Days = [];

        for (let i = 29; i >= 0; i--) {
            const d = new Date(); d.setDate(d.getDate() - i);
            const dateStr = d.toDateString();
            last30Days.push(dateStr);
            dailyData[dateStr] = 0;
        }

        records.forEach(r => {
            const dateStr = new Date(r.ts).toDateString();
            if (dailyData[dateStr] !== undefined) dailyData[dateStr]++;
        });

        const counts = last30Days.map(day => dailyData[day]);
        const trend = counts.map((_, i, arr) => {
            const start = Math.max(0, i - 6);
            const slice = arr.slice(start, i + 1);
            return (slice.reduce((a, b) => a + b, 0) / slice.length).toFixed(1);
        });

        const daysWithLogs = counts.filter(c => c > 0);
        const successDays = daysWithLogs.filter(c => c <= db.goal).length;
        const mastery = daysWithLogs.length > 0 ? Math.round((successDays / daysWithLogs.length) * 100) : 0;
        document.getElementById('mastery-rate').textContent = mastery + "%";

        if (records.length > 1) {
            let totalGap = 0, count = 0;
            const recent = records.slice(-50);
            for(let i = 1; i < recent.length; i++) {
                const diff = (recent[i].ts - recent[i-1].ts) / 3600000;
                if (diff < 18) { totalGap += diff; count++; }
            }
            document.getElementById('avg-gap').textContent = (count > 0 ? (totalGap / count).toFixed(1) : "0.0") + "h";
        }

        renderChart(last30Days.map(l => l.split(' ')[2]), counts, trend);
    }

    function renderChart(labels, counts, trend) {
        const ctx = document.getElementById('evolutionChart').getContext('2d');
        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [
                    { label: 'Tendance', data: trend, type: 'line', borderColor: '#4deeea', borderWidth: 4, pointRadius: 0, tension: 0.4 },
                    { label: 'Réel', data: counts, backgroundColor: '#ff2d55', borderRadius: 2 }
                ]
            },
            options: {
                responsive: true, maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    y: { 
                        ticks: { color: '#ffffff', font: { size: 14, weight: 'bold' } }, 
                        grid: { color: '#333' }, beginAtZero: true 
                    },
                    x: { 
                        ticks: { color: '#ffffff', font: { size: 12 } }, 
                        grid: { display: false } 
                    }
                }
            }
        });
    }

    window.onload = processEvolution;
</script>
</body>
</html>
