<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Éditeur de Sauvegarde Neuro-Stim</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --danger: #ef4444;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 24px;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 8px;
    }
    p.subtitle {
      color: var(--muted);
      margin-top: 0;
      margin-bottom: 24px;
    }
    .toolbar {
      display: flex;
      gap: 12px;
      background: var(--panel);
      padding: 16px;
      border-radius: 8px;
      border: 1px solid var(--border);
      margin-bottom: 24px;
      align-items: center;
      flex-wrap: wrap;
    }
    input[type="file"] {
      display: none;
    }
    .btn {
      background: var(--accent);
      color: #000;
      font-weight: 600;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      border: none;
      transition: background 0.2s;
      text-decoration: none;
      display: inline-block;
    }
    .btn:hover {
      background: var(--accent-hover);
      color: #fff;
    }
    .btn-secondary {
      background: #475569;
      color: #fff;
    }
    .btn-secondary:hover {
      background: #64748b;
    }
    .btn-danger {
      background: transparent;
      color: var(--danger);
      border: 1px solid var(--danger);
      padding: 4px 8px;
    }
    .btn-danger:hover {
      background: var(--danger);
      color: #fff;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--panel);
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }
    th {
      background: #0f172a;
      color: var(--muted);
      font-weight: 600;
      font-size: 0.85rem;
      text-transform: uppercase;
    }
    input[type="datetime-local"], input[type="number"] {
      background: #0f172a;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 10px;
      border-radius: 4px;
      font-family: inherit;
    }
    input[type="datetime-local"] {
      width: 220px;
    }
    input[type="number"] {
      width: 80px;
    }
    .empty-state {
      text-align: center;
      padding: 48px;
      color: var(--muted);
      background: var(--panel);
      border-radius: 8px;
      border: 1px dashed var(--border);
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Éditeur de Timestamp — Sauvegarde App</h1>
    <p class="subtitle">Importez votre fichier JSON, modifiez les lignes et téléchargez le fichier corrigé.</p>

    <div class="toolbar">
      <!-- Bouton de retour à l'accueil -->
      <a href="index.html" class="btn btn-secondary">Retour</a>

      <label class="btn">
        📁 Importer un fichier JSON
        <input type="file" id="fileInput" accept=".json">
      </label>
      
      <button class="btn btn-secondary" id="sortBtn" style="display:none;">⬇️ Trier: Récent en haut</button>
      <button class="btn" id="exportBtn" style="display:none; margin-left: auto;">💾 Télécharger newsave.json</button>
    </div>

    <div id="tableContainer">
      <div class="empty-state">
        Aucun fichier chargé. Veuillez sélectionner votre fichier <code>.json</code>.
      </div>
    </div>
  </div>

  <script>
    let rawData = null;
    let isSortDescending = false; // Tri par défaut (chronologique)

    const fileInput = document.getElementById('fileInput');
    const tableContainer = document.getElementById('tableContainer');
    const exportBtn = document.getElementById('exportBtn');
    const addBtn = document.getElementById('addBtn');
    const sortBtn = document.getElementById('sortBtn');

    // Import classique par input file
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        try {
          rawData = JSON.parse(event.target.result);
          if (!rawData.records) rawData.records = [];
          renderTable();
          exportBtn.style.display = 'inline-block';
          addBtn.style.display = 'inline-block';
          sortBtn.style.display = 'inline-block';
        } catch (err) {
          alert('Erreur lors de la lecture du fichier JSON : ' + err.message);
        }
      };
      reader.readAsText(file);
    });

    // Convertisseur Timestamp ms -> ISO local
    function tsToLocalISO(ts) {
      const date = new Date(ts);
      const tzOffset = date.getTimezoneOffset() * 60000;
      return (new Date(ts - tzOffset)).toISOString().slice(0, 19);
    }

    // Convertisseur ISO local -> Timestamp ms
    function localISOToTs(isoStr) {
      return new Date(isoStr).getTime();
    }

    // Gestion du tri (récent en haut / bas)
    sortBtn.addEventListener('click', () => {
      isSortDescending = !isSortDescending;
      sortBtn.textContent = isSortDescending ? "⬆️ Trier: Récent en bas" : "⬇️ Trier: Récent en haut";
      renderTable();
    });

    // Rendu du tableau d'édition
    function renderTable() {
      if (!rawData || !rawData.records) return;

      let displayRecords = rawData.records.map((rec, originalIndex) => ({ rec, originalIndex }));
      if (isSortDescending) {
        displayRecords.reverse();
      }

      let html = `
        <div style="margin-bottom: 12px; color: var(--muted); font-size: 0.9rem;">
          <strong>${rawData.records.length}</strong> enregistrement(s)
        </div>
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Date & Heure (Modifiable)</th>
              <th>Timestamp Raw (ms)</th>
              <th>P</th>
              <th>G</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
      `;

      displayRecords.forEach((item, viewIndex) => {
        const { rec, originalIndex } = item;
        const localDateStr = tsToLocalISO(rec.ts);
        html += `
          <tr>
            <td style="color:var(--muted);">${viewIndex + 1}</td>
            <td>
              <input type="datetime-local" step="1" value="${localDateStr}" onchange="updateTimestamp(${originalIndex}, this.value)">
            </td>
            <td style="font-family:monospace; color:var(--muted);" id="ts-raw-${originalIndex}">${rec.ts}</td>
            <td>
              <input type="number" step="0.01" value="${rec.p}" onchange="updateParam(${originalIndex}, 'p', this.value)">
            </td>
            <td>
              <input type="number" value="${rec.g}" onchange="updateParam(${originalIndex}, 'g', this.value)">
            </td>
            <td>
              <button class="btn btn-danger" onclick="deleteRecord(${originalIndex})">🗑️</button>
            </td>
          </tr>
        `;
      });

      html += `</tbody></table>`;
      tableContainer.innerHTML = html;
    }

    window.updateTimestamp = function(index, dateStr) {
      const newTs = localISOToTs(dateStr);
      if (!isNaN(newTs)) {
        rawData.records[index].ts = newTs;
        document.getElementById(`ts-raw-${index}`).textContent = newTs;
      }
    };

    window.updateParam = function(index, param, val) {
      rawData.records[index][param] = parseFloat(val);
    };

    window.deleteRecord = function(index) {
      rawData.records.splice(index, 1);
      renderTable();
    };

    addBtn.addEventListener('click', () => {
      const lastRec = rawData.records[rawData.records.length - 1] || { p: 0.65, g: 14 };
      rawData.records.push({
        ts: Date.now(),
        p: lastRec.p,
        g: lastRec.g
      });
      renderTable();
    });

    // Bouton d'export forcé sous newsave.json (compatible iPadOS)
    exportBtn.addEventListener('click', () => {
      const jsonString = JSON.stringify(rawData, null, 2);
      const blob = new Blob([jsonString], { type: "application/octet-stream" });
      const url = URL.createObjectURL(blob);
      
      const a = document.createElement('a');
      a.href = url;
      a.download = "newsave.json";
      document.body.appendChild(a);
      a.click();
      
      setTimeout(() => {
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }, 100);
    });
  </script>
</body>
</html>
