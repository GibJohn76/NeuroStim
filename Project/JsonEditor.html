<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Éditeur de Sauvegarde Neuro-Stim</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --danger: #ef4444;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 24px;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 8px;
    }
    p.subtitle {
      color: var(--muted);
      margin-top: 0;
      margin-bottom: 24px;
    }
    .toolbar {
      display: flex;
      gap: 12px;
      background: var(--panel);
      padding: 16px;
      border-radius: 8px;
      border: 1px solid var(--border);
      margin-bottom: 24px;
      align-items: center;
      flex-wrap: wrap;
    }
    input[type="file"] {
      display: none;
    }
    .btn {
      background: var(--accent);
      color: #000;
      font-weight: 600;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      border: none;
      transition: background 0.2s;
    }
    .btn:hover {
      background: var(--accent-hover);
      color: #fff;
    }
    .btn-secondary {
      background: #475569;
      color: #fff;
    }
    .btn-secondary:hover {
      background: #64748b;
    }
    .btn-danger {
      background: transparent;
      color: var(--danger);
      border: 1px solid var(--danger);
      padding: 4px 8px;
    }
    .btn-danger:hover {
      background: var(--danger);
      color: #fff;
    }
    .stats {
      margin-left: auto;
      color: var(--muted);
      font-size: 0.9rem;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--panel);
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }
    th {
      background: #0f172a;
      color: var(--muted);
      font-weight: 600;
      font-size: 0.85rem;
      text-transform: uppercase;
    }
    input[type="datetime-local"], input[type="number"] {
      background: #0f172a;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 10px;
      border-radius: 4px;
      font-family: inherit;
    }
    input[type="datetime-local"] {
      width: 220px;
    }
    input[type="number"] {
      width: 80px;
    }
    .empty-state {
      text-align: center;
      padding: 48px;
      color: var(--muted);
      background: var(--panel);
      border-radius: 8px;
      border: 1px dashed var(--border);
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Éditeur de Timestamp — Sauvegarde App</h1>
    <p class="subtitle">Chargez votre fichier JSON, modifiez les dates et exportez les données corrigées.</p>

    <div class="toolbar">
      <label class="btn">
        📁 Importer un fichier JSON
        <input type="file" id="fileInput" accept=".json">
      </label>
      <button class="btn btn-secondary" id="addBtn" style="display:none;">➕ Ajouter une ligne</button>
      <button class="btn" id="exportBtn" style="display:none; margin-left: 8px;">💾 Exporter le JSON</button>
      <span class="stats" id="stats"></span>
    </div>

    <div id="tableContainer">
      <div class="empty-state">
        Aucun fichier chargé. Veuillez sélectionner votre fichier <code>.json</code>.
      </div>
    </div>
  </div>

  <script>
    let rawData = null;

    const fileInput = document.getElementById('fileInput');
    const tableContainer = document.getElementById('tableContainer');
    const exportBtn = document.getElementById('exportBtn');
    const addBtn = document.getElementById('addBtn');
    const stats = document.getElementById('stats');

    // Importer le fichier JSON
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        try {
          rawData = JSON.parse(event.target.result);
          if (!rawData.records) rawData.records = [];
          renderTable();
          exportBtn.style.display = 'inline-block';
          addBtn.style.display = 'inline-block';
        } catch (err) {
          alert('Erreur lors de la lecture du fichier JSON : ' + err.message);
        }
      };
      reader.readAsText(file);
    });

    // Convertir Timestamp ms -> ISO local pour l'input datetime-local
    function tsToLocalISO(ts) {
      const date = new Date(ts);
      const tzOffset = date.getTimezoneOffset() * 60000;
      const localISOTime = (new Date(ts - tzOffset)).toISOString().slice(0, 19);
      return localISOTime;
    }

    // Convertir ISO local -> Timestamp ms
    function localISOToTs(isoStr) {
      return new Date(isoStr).getTime();
    }

    // Afficher le tableau d'édition
    function renderTable() {
      if (!rawData || !rawData.records) return;

      stats.textContent = `${rawData.records.length} enregistrement(s)`;

      let html = `
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Date & Heure (Modifiable)</th>
              <th>Timestamp Raw (ms)</th>
              <th>Paramètre P</th>
              <th>Paramètre G</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
      `;

      rawData.records.forEach((rec, index) => {
        const localDateStr = tsToLocalISO(rec.ts);
        html += `
          <tr>
            <td style="color:var(--muted);">${index + 1}</td>
            <td>
              <input type="datetime-local" step="1" value="${localDateStr}" onchange="updateTimestamp(${index}, this.value)">
            </td>
            <td style="font-family:monospace; color:var(--muted);" id="ts-raw-${index}">${rec.ts}</td>
            <td>
              <input type="number" step="0.01" value="${rec.p}" onchange="updateParam(${index}, 'p', this.value)">
            </td>
            <td>
              <input type="number" value="${rec.g}" onchange="updateParam(${index}, 'g', this.value)">
            </td>
            <td>
              <button class="btn btn-danger" onclick="deleteRecord(${index})">🗑️</button>
            </td>
          </tr>
        `;
      });

      html += `</tbody></table>`;
      tableContainer.innerHTML = html;
    }

    // Mettre à jour le timestamp dans la structure de données
    window.updateTimestamp = function(index, dateStr) {
      const newTs = localISOToTs(dateStr);
      if (!isNaN(newTs)) {
        rawData.records[index].ts = newTs;
        document.getElementById(`ts-raw-${index}`).textContent = newTs;
      }
    };

    // Mettre à jour P ou G
    window.updateParam = function(index, param, val) {
      rawData.records[index][param] = parseFloat(val);
    };

    // Supprimer une ligne
    window.deleteRecord = function(index) {
      rawData.records.splice(index, 1);
      renderTable();
    };

    // Ajouter une ligne
    addBtn.addEventListener('click', () => {
      const lastRec = rawData.records[rawData.records.length - 1] || { p: 0.65, g: 14 };
      rawData.records.push({
        ts: Date.now(),
        p: lastRec.p,
        g: lastRec.g
      });
      renderTable();
    });

    // Exporter le JSON modifié
    exportBtn.addEventListener('click', () => {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(rawData, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", "neuro_stim_backup_modified.json");
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    });
  </script>
</body>
</html>
